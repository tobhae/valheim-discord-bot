# What the bot shows and does: display settings, timing, switches and all texts.
# Edit this file without rebuilding the image. Save changes, then run
# `docker compose restart bot` to apply them. The container mounts it read-only.

# {placeholders} are filled in by the bot. Each section lists its supported
# placeholders. Unknown placeholders cause a startup error with the line number.
# Markdown (**bold**, *italic*) works in posts, but not in channel names or presence.

[display]
# Shown as {server} in the texts below.
server_name   = "Valheim"
max_players   = 10
# Name of the sidebar category. Change it and restart: the bot renames its category.
category_name = "Server Status"

[timing]
# Time in seconds
status_poll_seconds      = 30   # how often the server status is checked
event_poll_seconds       = 15   # how often the log is checked (deaths, raids, joins)
channel_rename_seconds   = 300  # Minimum time between renames of a sidebar row. Discord allows 2 per 10 minutes.
mention_cooldown_seconds = 60   # Bot Discord mention cooldown

[switches]
# Turn features on (true) or off (false). The texts below stay, so switching
# something back on later only means flipping it here and restarting.

# The sidebar category and its rows. Disabling the category removes the bot-created
# category and channels when empty. Manually configured channels in .env are preserved.
category_bar = true
status_row   = true  # row 1, [status_channel] below
player_row   = true  # row 2, [players_channel] below
player_names = true  # row 2 shows names (true) or always just the count (false)
presence     = true  # the "Playing ..." text under the bot's name

# Event notifications. Each switch controls its corresponding message in [events].
server_online  = true
server_offline = true
player_joined  = true
player_left    = true
death          = true
raid           = true
mention_reply  = true # Easter egg: the bot replies when someone mentions it in Discord.

# Sidebar row 1 (status_row). Discord allows 2 renames per 10 minutes, so the bot renames at
# most every 5 minutes and the text can be up to 5 minutes old.
# {uptime} looks like "42m", "3h 42m" or, from one day on, "1d 3h".
# Placeholders: {server} {state} {players} {max_players} {uptime} {world}
[status_channel]
online   = "🟢・Online: {uptime}"
starting = "🟡・Starting..."
offline  = "🔴・Offline"
unknown  = "⚪・Status Unknown"

# Sidebar row 2 (player_row): players online. Names come from the DatHost API or server log.
# If names are unavailable or player_names is false, the bot shows the count.
# Placeholders: {server} {names} {players} {max_players}
[players_channel]
names = "👥・{names}"            # names are known
count = "👥・{players} online"   # only the number is known (or wanted)
empty = "👥・No vikings online"  # nobody online, or server down

# The "Playing ..." text under the bot's name. Updated every poll.
# Placeholders: {server} {state} {players} {max_players} {uptime} {world}
[presence]
online  = "Valheim・{players}/{max_players} online"
offline = "Valheim・Server {state}"

# Posts in the events channel (each has a switch above).
# A list ([ "...", "..." ]) means the bot picks one at random.
[events]
server_online  = "🟢・**{server}** is online"      # {server}
server_offline = "🔴・**{server}** is offline"   # {server}
player_joined  = "🗡️・**{name}** has joined {server}"  # {name} {server}
player_left    = "🚪・**{name}** has left {server}"    # {name} {server}

# Death messages. One variant is chosen at random. Feel free to add your own messages.
# Placeholders: {name} {server}
death = [
    "💀・**{name}** has fallen. Odin is not impressed.",
    "💀・**{name}** died. The Valkyries are on their way.",
    "💀・**{name}** met an untimely end. Go get your gear back!",
    "💀・**{name}** has been sent to Valhalla (temporarily).",
    "💀・**{name}** has arrived at Valhalla.",
    "💀・**{name}** underestimated the dangers of the tenth world.",
    "💀・**{name}** has fallen. Their saga ends here... for now.",
    "💀・**{name}** has fallen. Let the skalds tell the tale.",
]

# Raid notifications. {attackers} is resolved using the raid definitions below.
# If a raid identifier is not listed in [raids], raid_unknown is used instead.
# Placeholders: {server} {attackers} {raid}
raid = "⚔️・**Raid on {server}!** Incoming: {attackers}. To arms, vikings!"
# For raids missing from [raids] below. {server} {raid}
raid_unknown = "⚔️・**Raid on {server}!** Incoming: something unknown (`{raid}`). To arms, vikings!"

# Replies when someone mentions the bot (mention_reply switch). One is chosen at random. Feel free to add your own messages.
# Placeholders: {name} {server}
[replies]
mention = [
    "🐦‍⬛・Hugin heard you, **{name}**. Munin will remember.",
    "🍺・Skål, **{name}**! Now get back to work on {server}.",
    "🪓・**{name}**, the trees of {server} won't chop themselves.",
    "🌲・Have you tried asking the Elder, **{name}**?",
    "⚡・Odin is watching, **{name}**. He always is.",
]

# Valheim raid identifiers mapped to human-readable attacker descriptions.
# These descriptions replace {attackers} in the raid notification above.
[raids]
army_eikthyr  = "Eikthyr's army (boars and necks)"
army_theelder = "The Elder's army (greydwarfs)"
army_bonemass = "Bonemass' army (draugr and skeletons)"
army_moder    = "Moder's army (drakes)"
army_goblin   = "A fuling horde"
army_gjall    = "Gjall and ticks"
army_seekers  = "A seeker swarm"
army_charred  = "The charred army"
foresttrolls  = "Forest trolls"
blobs         = "Blobs and oozers"
skeletons     = "Skeletons"
surtlings     = "Surtlings"
wolves        = "A wolf pack"
bats          = "A swarm of bats"
